name: Validate PickApp Mobility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/pesquisa-pontos-trafego-estimativas"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application (development mode)
        run: npm run build:dev
      - name: Lint
        run: npm run lint
